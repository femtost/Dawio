<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8">
        <title>Dawio App Sample</title>
        <!-- Note: This is always bundle.min.js, not index-sample.js -->
        <script src="bundle.min.js"></script>
        <link rel="stylesheet" href="bundle.min.css">
    </head>
    <body>
        <div style="padding-left:25vw; padding-right:25vw;">
            <h1>Dawio App</h1><hr>
            <div>This is a sample Dawio app.</div>
        </div>
    </body>
    <script>
        var log = console.log;
        // Uncaught synchronous exceptions
        window.addEventListener('error', (event) => {
            console.error('Uncaught exception:', event.error);
            alert("Error: "+event.error);
        });
        // Unhandled Promise rejections
        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled Promise rejection:', event.reason);
            alert("Rejection: "+event.reason);
        });

        window.addEventListener("load",async()=>{
            var body = document.querySelector("body");

            // Fast sync call
            var res = await call("echo",["abc",123]);
            body.innerHTML = "<div>"+JSON.stringify(res)+"<div>";

            setTimeout(async()=>{
                var res = await call("echo",["abcffffffffff",123]);
                body.innerHTML = "<div>"+JSON.stringify(res)+"<div>";
            },2000);

            // var res = await proc("sum",[1,999999999]);
            // alert(res);
            // body.innerHTML += `<div>${JSON.stringify(res)}</div>`;
        });
    </script>
</html>
