<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8">
        <title>Dawio App</title>
    </head>
    <body>
        <div style="padding-left:25vw; padding-right:25vw;">
            <h1>Dawio App</h1>
            <hr>
            <div>
                This is a sample Dawio app.
            </div>
        </div>
    </body>
    <script>
        var log = console.log;
        window.addEventListener("load",async()=>{
            var body = document.querySelector("body");

            // Fast sync call
            var res = await call("echo",["abc",123]);
            body.innerHTML = "<div>"+JSON.stringify(res)+"<div>";

            // var res = await proc("sum",[1,999999999]);
            // alert(res);
            // body.innerHTML += `<div>${JSON.stringify(res)}</div>`;
        });
    </script>
</html>
